<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

<div id="intro">
    <h1>❤️ Happy 3rd Monthsary ❤️</h1>
    <h3>For My Love, Gwen</h3>

    <button id="startBtn">
        Click to Open ❤️
    </button>
</div>

<div id="portraitContainer">

    <p id="portrait"></p>

</div>

<div id="letterContainer">

    <h2>To My Love ❤️</h2>

    <p id="letter"></p>

</div>

<div id="giftContainer">

    <button id="giftBtn">
        🌸 Open My Flower 🌸
    </button>

    <div id="bouquet">

        <img src="flower.png" alt="flower">

        <h2>Happy 3rd Monthsary ❤️</h2>

        <p>
            This flower may someday wilt,<br>
            but my love for you never will.
        </p>

        <h3>I Love You, Gwen ❤️</h3>

    </div>

</div>

<script src="script.js"></script>
<div id="petals"></div>
</body>
</html>
